[workspace]
members = ["crates/*"]
default-members = [".", "crates/leo-core", "crates/leo-services", "crates/leo-web", "crates/leo-host"]
resolver = "2"

[workspace.package]
version = "0.4.30"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
leo-core = { path = "crates/leo-core" }
leo-services = { path = "crates/leo-services" }
leo-web = { path = "crates/leo-web" }
leo-host = { path = "crates/leo-host" }
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
colored = "3"
cpal = "0.18"
dirs = "6"
dotenvy = "0.15"
keyring = "4"
nucleo = "0.5"
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
lopdf = { version = "0.45", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
flate2 = "1"
url = "2"
crc32fast = "1"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }
serde_yaml = "0.9"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "1"
toml_edit = "0.25.13"
candle-core = "=0.10.0"
rusqlite = { version = "0.40", features = ["bundled"] }
candle-nn = "=0.10.0"
candle-transformers = "=0.10.0"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[package]
name = "leo"
description = "Opens, updates or uninstalls the leo app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = []

[[bin]]
name = "leo"
path = "src/main.rs"

[dependencies]
leo-core.workspace = true
leo-services.workspace = true
anyhow.workspace = true
clap.workspace = true
colored.workspace = true
dirs.workspace = true
dotenvy.workspace = true
tempfile.workspace = true

[dev-dependencies]
libc.workspace = true
leo-services = { workspace = true, features = ["test-support"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[profile.dev.package.sha2]
opt-level = 3
